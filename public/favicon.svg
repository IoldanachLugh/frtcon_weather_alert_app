<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 64 64"
   version="1.1"
   id="svg10"
   sodipodi:docname="favicon.svg"
   inkscape:version="1.3.2 (091e20e, 2023-11-25, custom)"
   inkscape:export-filename="favicon.png"
   inkscape:export-xdpi="384"
   inkscape:export-ydpi="384"
   xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
   xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <sodipodi:namedview
     id="namedview10"
     pagecolor="#ffffff"
     bordercolor="#666666"
     borderopacity="1.0"
     inkscape:showpageshadow="2"
     inkscape:pageopacity="0.0"
     inkscape:pagecheckerboard="0"
     inkscape:deskcolor="#d1d1d1"
     inkscape:zoom="3.1405485"
     inkscape:cx="49.672852"
     inkscape:cy="-34.866521"
     inkscape:window-width="2560"
     inkscape:window-height="1351"
     inkscape:window-x="-9"
     inkscape:window-y="-9"
     inkscape:window-maximized="1"
     inkscape:current-layer="g10" />
  <defs
     id="defs8">
    <!-- One snowflake arm: a spoke from center to tip, with a single
         angled branch pair near the tip. Kept simple so it still reads
         clearly at 16px. -->
    <g
       id="arm">
      <line
         x1="0"
         y1="0"
         x2="0"
         y2="23"
         stroke-linecap="round"
         id="line1" />
      <line
         x1="0"
         y1="14"
         x2="-6"
         y2="20"
         stroke-linecap="round"
         id="line2" />
      <line
         x1="0"
         y1="14"
         x2="6"
         y2="20"
         stroke-linecap="round"
         id="line3" />
    </g>
    <g
       id="flake">
      <use
         href="#arm"
         transform="rotate(0)"
         id="use3" />
      <use
         href="#arm"
         transform="rotate(60)"
         id="use4" />
      <use
         href="#arm"
         transform="rotate(120)"
         id="use5" />
      <use
         href="#arm"
         transform="rotate(180)"
         id="use6" />
      <use
         href="#arm"
         transform="rotate(240)"
         id="use7" />
      <use
         href="#arm"
         transform="rotate(300)"
         id="use8" />
    </g>
  </defs>
  <!-- Background: same deep navy used throughout the app -->
  <rect
     x="0"
     y="0"
     width="64"
     height="64"
     rx="12"
     fill="#0b1f3a"
     id="rect8" />
  <!-- A smaller, fainter flake peeking out behind/beside the main one
       implies a second flake in a flurry without adding clutter. -->
  <!-- The primary, bold flake -->
  <g
     stroke="#ffffff"
     stroke-width="3.5129"
     id="g10"
     transform="matrix(1.3113027,0,0,1.3076152,-10.886636,-6.8845976)"
     style="stroke:#ffffff;fill:#ffffff;stroke-width:2.8863305">
    <use
       href="#flake"
       transform="matrix(0.54786098,0,0,0.54961694,35.693982,19.410948)"
       id="use11"
       style="display:inline;fill:#37abc8;stroke:#37abc8;stroke-width:3.68196" />
    <use
       href="#flake"
       transform="matrix(0.54786098,0,0,0.54961694,43.684121,39.122526)"
       id="use12"
       style="display:inline;fill:#6f8a91;stroke:#6f8a91;stroke-width:3.68196" />
    <use
       href="#flake"
       transform="matrix(0.82068476,0,0,0.81965769,26.921539,33.290962)"
       id="use10"
       style="display:inline;fill:#ffffff;stroke:#ffffff;stroke-width:3.87109919" />
  </g>
</svg>
